name: Empaquetar tema

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear amuma.zip
        run: ./tools/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: amuma-tema
          path: amuma.zip
